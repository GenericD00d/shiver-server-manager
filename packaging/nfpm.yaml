# Build with: ARCH=amd64 VERSION=1.0.0 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: shiver-server-manager
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: GenericD00d <https://github.com/GenericD00d>
description: |
  Sets up and runs Sharkord servers from a terminal menu.
  Several Sharkord servers on one machine, each on its own domain, with
  Caddy for HTTPS, encrypted data folders, backups, import and export,
  and the Shiver plugin. Not an official Sharkord project.
homepage: https://github.com/GenericD00d/shiver-server-manager
license: MIT
depends:
  - systemd
  - libpam0g
  - rsync
  - util-linux
  - iproute2
  - e2fsprogs
recommends:
  - ufw
  - cryptsetup
suggests:
  - sqlite3
  - libnss3-tools
contents:
  - src: ./shiver-server-manager
    dst: /usr/bin/shiver-server-manager
    file_info: { mode: 0755 }
  - src: packaging/sudoers
    dst: /etc/sudoers.d/shiver-server-manager
    type: config|noreplace
    file_info: { mode: 0440 }
  - src: packaging/pam
    dst: /etc/pam.d/shiver-server-manager
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: packaging/sharkord@.service
    dst: /usr/lib/systemd/system/sharkord@.service
    file_info: { mode: 0644 }
  - src: packaging/shiver-server-manager-health.service
    dst: /usr/lib/systemd/system/shiver-server-manager-health.service
    file_info: { mode: 0644 }
  - src: packaging/shiver-server-manager-health.timer
    dst: /usr/lib/systemd/system/shiver-server-manager-health.timer
    file_info: { mode: 0644 }
  - src: packaging/shiver-server-manager-backup.service
    dst: /usr/lib/systemd/system/shiver-server-manager-backup.service
    file_info: { mode: 0644 }
  - src: packaging/shiver-server-manager-backup.timer
    dst: /usr/lib/systemd/system/shiver-server-manager-backup.timer
    file_info: { mode: 0644 }
  - src: packaging/shiver-server-manager-web.service
    dst: /usr/lib/systemd/system/shiver-server-manager-web.service
    file_info: { mode: 0644 }
  - src: packaging/logrotate
    dst: /etc/logrotate.d/shiver-server-manager
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/shiver-server-manager/copyright
    file_info: { mode: 0644 }
scripts:
  postinstall: packaging/postinst.sh
  preremove: packaging/prerm.sh
  postremove: packaging/postrm.sh

name: Release

# Push a tag like v1.0.0 to publish .deb and .rpm packages for amd64 and arm64.
on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job may write, to create the release.
permissions:
  contents: read

env:
  NFPM_VERSION: v2.48.0

jobs:
  build:
    strategy:
      matrix:
        include:
          # Built natively per architecture, since PAM needs cgo, inside
          # AlmaLinux 8 (packaging/build.sh) so the binary runs on every
          # supported system's glibc.
          - runner: ubuntu-24.04
            arch: amd64
            rpmarch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rpmarch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Build the web page
        run: cd internal/web/ui && npm ci --no-audit --no-fund && npm run build
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: go test ./...
      - run: sudo visudo -cf packaging/sudoers
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go mod download
          docker run --rm -v "$PWD:/src" -v "$(go env GOROOT):/goroot:ro" -v "$(go env GOMODCACHE):/gomod" almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b sh /src/packaging/build.sh "$VERSION"
          ./shiver-server-manager version
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION
          mkdir -p dist
          # Named as selfupdate.PackageName expects.
          ARCH=${{ matrix.arch }} VERSION=$VERSION nfpm package -f packaging/nfpm.yaml -p deb -t "dist/shiver-server-manager_${VERSION}_${{ matrix.arch }}.deb"
          ARCH=${{ matrix.arch }} VERSION=$VERSION nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/shiver-server-manager-${VERSION}-1.${{ matrix.rpmarch }}.rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = index($0, v) == 1; next} p' ../CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" *.deb *.rpm SHA256SUMS --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"

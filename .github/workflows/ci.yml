name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NFPM_VERSION: v2.48.0

jobs:
  # docs/standards.md: the docs' files, sections, paths and links, and these workflows' own pins.
  standard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: python3 scripts/check-docs.py

  # Unit tests, then one build for every system: the binaries are built
  # inside AlmaLinux 8 (glibc 2.28, older than any supported system's) and
  # packaged as a .deb and an .rpm.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            rpmarch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rpmarch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev cryptsetup dosfstools rsync
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Build the web page
        run: |
          cd internal/web/ui
          npm ci --no-audit --no-fund
          npm run build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go mod verify
      - run: go test -race ./...
      - name: Check the sudoers file
        run: sudo visudo -cf packaging/sudoers
      - name: Build on glibc 2.28
        run: |
          go mod download
          docker run --rm -e TESTS=1 -v "$PWD:/src" -v "$(go env GOROOT):/goroot:ro" -v "$(go env GOMODCACHE):/gomod" almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b sh /src/packaging/build.sh 0.0.0-ci
          ./shiver-server-manager version
      - name: Package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION
          mkdir -p dist
          ARCH=${{ matrix.arch }} VERSION=0.0.0-ci nfpm package -f packaging/nfpm.yaml -p deb -t dist/shiver-server-manager_0.0.0-ci_${{ matrix.arch }}.deb
          ARCH=${{ matrix.arch }} VERSION=0.0.0-ci nfpm package -f packaging/nfpm.yaml -p rpm -t dist/shiver-server-manager-0.0.0-ci-1.${{ matrix.rpmarch }}.rpm
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          cp auth.test cli.test dist/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pkg-${{ matrix.arch }}
          path: dist/

  # The full end-to-end run on Ubuntu, both architectures, including the
  # browser tests (voice and the web page).
  e2e-ubuntu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pkg-${{ matrix.arch }}
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y cryptsetup dosfstools rsync
      # Below here changes the runner's system. The runner is thrown away after.
      - name: Install the .deb as an admin would
        run: |
          mv dist/auth.test dist/cli.test . && chmod +x auth.test cli.test
          sudo apt-get install -y ./dist/*.deb
          getent group shiver-admins
          sudo test -d /var/lib/shiver-server-manager/vault
          test "$(sudo stat -c %a /var/lib/shiver-server-manager)" = 711
          test "$(sudo stat -c %a /etc/sudoers.d/shiver-server-manager)" = 440
          systemctl is-enabled shiver-server-manager-health.timer shiver-server-manager-backup.timer
          systemctl list-timers 'shiver-server-manager-*' --no-pager
          # The timers would run during the tests; keep the tests deterministic.
          sudo systemctl stop shiver-server-manager-health.timer shiver-server-manager-backup.timer
      - name: Ubuntu's own (too old) Caddy, which setup must upgrade
        run: |
          sudo apt-get install -y caddy
          caddy version
          caddy version | grep -q '^2\.6\.'
      - name: Test accounts
        run: |
          sudo useradd -m -G shiver-admins ssm-admin
          sudo useradd -m ssm-outsider
          echo "ssm-admin:$SSM_PAM_PASSWORD" | sudo chpasswd
          echo "ssm-outsider:$SSM_PAM_PASSWORD" | sudo chpasswd
          # The sudoers rule lets the admin start the manager without a sudo password.
          sudo -u ssm-admin sudo -n /usr/bin/shiver-server-manager version
          if sudo -u ssm-outsider sudo -n /usr/bin/shiver-server-manager version; then echo "a non-admin got in"; exit 1; fi
        env:
          SSM_PAM_PASSWORD: Ci-Only-Passw0rd
      - name: Start Pebble (Let's Encrypt's test server)
        run: |
          git clone -q --depth 1 --branch v2.10.1 https://github.com/letsencrypt/pebble /tmp/pebble
          cd /tmp/pebble && go build -o pebble ./cmd/pebble
          PEBBLE_VA_ALWAYS_VALID=1 PEBBLE_WFE_NONCEREJECT=0 nohup ./pebble -config test/config/pebble-config.json > /tmp/pebble.log 2>&1 &
          echo "127.0.0.1 chat-a.example.com chat-b.example.com chat-c.example.com" | sudo tee -a /etc/hosts
          for i in $(seq 30); do curl -sfk https://localhost:14000/dir >/dev/null && break; sleep 1; done
          curl -sfk https://localhost:14000/dir
      - name: PAM and end-to-end tests (as root)
        run: |
          export SSM_PUBLIC_IP=$(hostname -I | awk '{print $1}')
          sudo --preserve-env=SSM_PAM_ADMIN,SSM_PAM_OUTSIDER,SSM_PAM_PASSWORD,SSM_E2E_BIN ./auth.test -test.run 'TestPAM' -test.v
          sudo --preserve-env=SSM_PAM_ADMIN,SSM_PAM_OUTSIDER,SSM_PAM_PASSWORD,SSM_E2E_BIN,SSM_ACME_CA,SSM_ACME_CA_ROOT,SSM_PEBBLE_ROOTS,SSM_PUBLIC_IP ./cli.test -test.run 'TestE2E' -test.v -test.timeout 30m
        env:
          SSM_PAM_ADMIN: ssm-admin
          SSM_PAM_OUTSIDER: ssm-outsider
          SSM_PAM_PASSWORD: Ci-Only-Passw0rd
          SSM_E2E_BIN: /usr/bin/shiver-server-manager
          SSM_ACME_CA: https://localhost:14000/dir
          SSM_ACME_CA_ROOT: /tmp/pebble/test/certs/pebble.minica.pem
          SSM_PEBBLE_ROOTS: https://localhost:15000/roots/0
      - name: Voice test (two browsers with fake microphones)
        run: |
          cd test/browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node voice.mjs https://chat-a.example.com --insecure --expect-shiver
      - name: Web page (real login, real servers)
        run: |
          sudo sh -c 'unset SUDO_USER; shiver-server-manager web enable'
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8443/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8443/)" = 421
          cd test/browser
          node web.mjs ssm-admin "$SSM_PAM_PASSWORD"
        env:
          SSM_PAM_PASSWORD: Ci-Only-Passw0rd
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: browser-screenshots-${{ matrix.arch }}
          path: test/browser/*.png
          if-no-files-found: ignore
      - name: Removing the package leaves every server alone
        run: |
          sudo apt-get remove -y shiver-server-manager
          systemctl is-active sharkord@chat-a
          sudo test -d /var/lib/shiver-server-manager/vault
          if systemctl is-enabled shiver-server-manager-health.timer; then echo "timer still enabled"; exit 1; fi
      - name: Show what the manager logged
        if: always()
        run: |
          sudo cat /var/log/shiver-server-manager.log || true
          sudo journalctl -u 'sharkord@*' --no-pager -n 200 || true
          sudo journalctl -u caddy --no-pager -n 100 || true
          cat /tmp/pebble.log || true

  # The packages' install scripts, sudoers and PAM files, and that the
  # binary runs, on every supported system (containers, so no systemd).
  # Ubuntu 26.04 has sudo-rs and the Rust coreutils by default.
  install-scripts:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13", "fedora:43", "fedora:44", "almalinux:9", "almalinux:10", "rockylinux/rockylinux:9", "rockylinux/rockylinux:10", "opensuse/leap:16.0", "opensuse/tumbleweed"]
    runs-on: ubuntu-24.04
    # Not pinned by digest, on purpose: this job exists to catch each distribution's current image
    # breaking the install scripts. It holds no secrets.
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pkg-amd64
          path: dist
      - name: Install, check, remove
        run: sh test/install-check.sh dist

  # The end-to-end tests on each distribution's own cloud image, booted
  # under KVM: real systemd, PAM, SELinux where the system has it, LUKS and
  # firewalld. amd64 only: the arm64 runners have no KVM.
  e2e-vm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        system: [debian-13, fedora-44, alma-9, alma-10, tumbleweed, leap-16]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pkg-amd64
          path: vm
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Pebble (Let's Encrypt's test server), for inside the VM
        run: |
          git clone -q --depth 1 --branch v2.10.1 https://github.com/letsencrypt/pebble /tmp/pebble
          cd /tmp/pebble && CGO_ENABLED=0 go build -o pebble ./cmd/pebble
          mkdir -p "$GITHUB_WORKSPACE/vm/pebble/test"
          cp pebble "$GITHUB_WORKSPACE/vm/pebble/"
          cp -r test/config test/certs "$GITHUB_WORKSPACE/vm/pebble/test/"
      # The cloud images change now and then; a weekly key keeps them fresh.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/vm/*.qcow2
          key: vm-image-${{ matrix.system }}-${{ steps.week.outputs.week }}
      - name: End-to-end tests in the VM
        run: bash test/vm/run.sh ${{ matrix.system }} vm
      - name: VM console
        if: failure()
        run: tail -n 200 /tmp/vm/console.log || true

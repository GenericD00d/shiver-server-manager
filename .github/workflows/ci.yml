name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=ci" ./cmd/shiver-server-manager
      - run: ./shiver-server-manager version
      - name: Check the sudoers file
        run: sudo visudo -cf packaging/sudoers

      # Below here changes the runner's system: a real PAM service, test
      # accounts, and the manager's folders. The runner is thrown away after.
      - name: Test accounts and PAM service
        run: |
          sudo install -m 644 packaging/pam /etc/pam.d/shiver-server-manager
          sudo groupadd --system shiver-admins
          sudo useradd -m -G shiver-admins ssm-admin
          sudo useradd -m ssm-outsider
          echo "ssm-admin:$SSM_PAM_PASSWORD" | sudo chpasswd
          echo "ssm-outsider:$SSM_PAM_PASSWORD" | sudo chpasswd
          sudo install -m 755 -o root -g root shiver-server-manager /usr/local/bin/shiver-server-manager
          sudo install -m 644 packaging/sharkord@.service /usr/lib/systemd/system/sharkord@.service
          sudo systemctl daemon-reload
        env:
          SSM_PAM_PASSWORD: Ci-Only-Passw0rd
      - name: Start Pebble (Let's Encrypt's test server)
        run: |
          git clone -q --depth 1 --branch v2.10.1 https://github.com/letsencrypt/pebble /tmp/pebble
          cd /tmp/pebble && go build -o pebble ./cmd/pebble
          PEBBLE_VA_ALWAYS_VALID=1 PEBBLE_WFE_NONCEREJECT=0 nohup ./pebble -config test/config/pebble-config.json > /tmp/pebble.log 2>&1 &
          echo "127.0.0.1 chat-a.example.com chat-b.example.com chat-c.example.com" | sudo tee -a /etc/hosts
          for i in $(seq 30); do curl -sfk https://localhost:14000/dir >/dev/null && break; sleep 1; done
          curl -sfk https://localhost:14000/dir
      - name: PAM and end-to-end tests (as root)
        run: |
          go test -c -o auth.test ./internal/auth
          go test -c -o cli.test ./internal/cli
          export SSM_PUBLIC_IP=$(hostname -I | awk '{print $1}')
          sudo --preserve-env=SSM_PAM_ADMIN,SSM_PAM_OUTSIDER,SSM_PAM_PASSWORD,SSM_E2E_BIN ./auth.test -test.run 'TestPAM' -test.v
          sudo --preserve-env=SSM_PAM_ADMIN,SSM_PAM_OUTSIDER,SSM_PAM_PASSWORD,SSM_E2E_BIN,SSM_ACME_CA,SSM_ACME_CA_ROOT,SSM_PEBBLE_ROOTS,SSM_PUBLIC_IP ./cli.test -test.run 'TestE2E' -test.v -test.timeout 30m
        env:
          SSM_PAM_ADMIN: ssm-admin
          SSM_PAM_OUTSIDER: ssm-outsider
          SSM_PAM_PASSWORD: Ci-Only-Passw0rd
          SSM_E2E_BIN: /usr/local/bin/shiver-server-manager
          SSM_ACME_CA: https://localhost:14000/dir
          SSM_ACME_CA_ROOT: /tmp/pebble/test/certs/pebble.minica.pem
          SSM_PEBBLE_ROOTS: https://localhost:15000/roots/0
      - name: Voice test (two browsers with fake microphones)
        run: |
          cd test/voice
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node voice.mjs https://chat-a.example.com --insecure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: voice-screenshots-${{ matrix.runner }}
          path: test/voice/*.png
          if-no-files-found: ignore
      - name: Show what the manager logged
        if: always()
        run: |
          sudo cat /var/log/shiver-server-manager.log || true
          sudo journalctl -u 'sharkord@*' --no-pager -n 200 || true
          sudo journalctl -u caddy --no-pager -n 100 || true
          sudo ls -la /etc/caddy /etc/caddy/* || true
          sudo namei -l /etc/caddy/Caddyfile || true
          sudo runuser -u caddy -- /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile || true
          cat /tmp/pebble.log || true

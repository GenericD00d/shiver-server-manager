name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44", "almalinux:9", "almalinux:10", "opensuse/leap:16.0", "opensuse/tumbleweed", "archlinux:latest"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          . /etc/os-release
          if command -v dnf; then
            case "$ID" in fedora) r=fedora-$VERSION_ID;; *) r=epel-${VERSION_ID%%.*};; esac
            curl -fsSo /etc/yum.repos.d/caddy.repo https://copr.fedorainfracloud.org/coprs/g/caddy/caddy/repo/$r/group_caddy-caddy-$r.repo
            cat /etc/yum.repos.d/caddy.repo
            dnf -y install caddy 2>&1 | tail -5
            rpm -qi caddy | head -12
          fi
          if command -v zypper; then
            curl -fsS https://dl.cloudsmith.io/public/caddy/stable/rpm/any-distro/any-version/repodata/repomd.xml | head -3 || echo "no cloudsmith rpm"
            zypper -n -q install caddy >/dev/null; rpm -qi caddy | head -12
            for p in server:http devel:languages:go; do v=$(echo $VERSION_ID | sed 's/^16.0$/16.0/'); curl -fsS "https://download.opensuse.org/repositories/${p/:/:\/}/openSUSE_Leap_${VERSION_ID}/repodata/repomd.xml" >/dev/null && echo "obs $p leap ok"; done
            curl -fsSL "https://download.opensuse.org/repositories/server:/http/" | grep -o 'href="[^"]*"' | head -30
          fi
          if command -v pacman; then pacman -Sy --noconfirm -q caddy sudo >/dev/null 2>&1; pacman -Qi caddy | head -3; grep -n includedir /etc/sudoers; cat /etc/pam.d/system-auth; fi
          echo ==== caddy; caddy version
          echo ==== unit; cat /usr/lib/systemd/system/caddy.service
          echo ==== Caddyfile; cat /etc/caddy/Caddyfile; ls -laR /etc/caddy
          getent passwd caddy
          echo ==== tmpfiles; cat /usr/lib/tmpfiles.d/caddy*.conf 2>/dev/null
          echo ==== pam; for f in system-auth common-auth common-account password-auth; do [ -f /etc/pam.d/$f ] && { echo "-- $f"; grep -v '^#' /etc/pam.d/$f; }; done
